[project]
name = "idle-mind"
version = "0.1.0"
description = "A conversational agent with a persistent background cognitive process"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "aiosqlite>=0.20",
]

[project.scripts]
idle-mind = "idle_mind.repl:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idle_mind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
