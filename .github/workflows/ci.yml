name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fieldvision/requirements.txt
      # fieldvision's requirements only. The root requirements.txt pulls in torch, ultralytics
      # and mediapipe, which none of these tests need.
      - id: install
        run: pip install -r fieldvision/requirements.txt ruff==0.17.3
      # Syntax errors and undefined names only.
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 --target-version py312 --output-format=github .
      - name: Pytest (tests/)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest tests -q
      # test_event_schemas.py and test_ingest_segment.py read capture files from
      # fieldvision/samples/, which is gitignored and only exists on the capture machines.
      - name: Pytest (fieldvision/tests)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: fieldvision
        run: >-
          pytest tests -q --continue-on-collection-errors
          --ignore=tests/test_event_schemas.py
          --ignore=tests/test_ingest_segment.py
